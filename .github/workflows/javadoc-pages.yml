name: Publish Andalus Javadoc

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven


      - name: Check out Aqli snapshot dependencies
        uses: actions/checkout@v4
        with:
          repository: bhangun/aqli
          path: _aqli
          ref: main

      # Correct the synthetic :tokenizer parent project until the upstream settings fix lands.
      - name: Fix AQLI tokenizer Gradle project directory
        working-directory: _aqli
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          content = settings.read_text(encoding="utf-8")
          old = 'if (rootPart in listOf("core", "spi", "sdk", "plugin", "observability", "tokenizer")) {'
          new = "\n".join([
              "if (rootPart == \"tokenizer\") {",
              "            // The tokenizer module lives under framework/core.",
              "            mappedDir = \"framework/core\"",
              "        } else if (rootPart in listOf(\"core\", \"spi\", \"sdk\", \"plugin\", \"observability\")) {",
          ])
          if content.count(old) != 1:
              raise SystemExit("Unexpected AQLI settings.gradle.kts layout; refusing to patch")
          settings.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Check out Aljabr (Aqli dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aljabr
          path: aljabr
          ref: main

      - name: Install Aqli snapshot dependencies
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          ./gradlew --no-daemon --parallel -x test \
            :spi:aqli-spi-inference:publishToMavenLocal \
            :sdk:aqli-sdk-core:publishToMavenLocal \
            :sdk:aqli-sdk:publishToMavenLocal

      - name: Generate aggregate Javadoc
        run: |
          ./mvnw -B -ntp \
            javadoc:aggregate-no-fork \
            -DskipTests \
            -Dmaven.test.skip=true \
            -DexcludePackageNames=tech.kayys.andalus.agent.backend.gamelan \
            -Dmaven.javadoc.failOnError=false \
            -Dmaven.javadoc.failOnWarnings=false
          reports="$(find framework -path '*/target/reports/apidocs/index.html' -print)"
          test -n "$reports"
          printf '%s\n' "$reports"

      - name: Assemble module documentation site
        run: |
          set -euo pipefail
          rm -rf target/pages
          mkdir -p target/pages/modules
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Andalus API Documentation</title></head><body><h1>Andalus API Documentation</h1><p>Generated from the Maven reactor.</p><ul>'
            while IFS= read -r report; do
              module_dir="${report%/target/reports/apidocs/index.html}"
              module_name="$(basename "$module_dir")"
              destination="target/pages/modules/${module_dir#./}"
              mkdir -p "$destination"
              cp -R "$module_dir/target/reports/apidocs/." "$destination/"
              printf '<li><a href="/andalus/modules/%s/index.html">%s</a></li>\n' "${module_dir#./}" "$module_name"
            done < <(find . -path '*/target/reports/apidocs/index.html' -not -path './target/*' | sort)
            printf '%s\n' '</ul></body></html>'
          } > target/pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    name: Deploy Javadoc Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
