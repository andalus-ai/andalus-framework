name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # ── Aljabr & AQLI SPI/SDK Bootstrap ────────────────────────────
      # AQLI still uses the former Alkhawarizm sibling directory and Maven
      # coordinates. Check out the current Aljabr repository at that legacy
      # path, then align AQLI's external module coordinates with Aljabr.
      # Aljabr's default settings keep Tafkir-only quantization opt-in.
      - name: Checkout aljabr (AQLI source dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aljabr
          path: alkhawarizm
          ref: main

      - name: Checkout aqli (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aqli
          path: _aqli
          ref: main

      # AQLI's settings still look for ../alkhawarizm. Keep that directory
      # contract, but migrate old dependency coordinates to current Aljabr GAVs.
      - name: Align AQLI dependency coordinates with Aljabr
        working-directory: _aqli
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("framework"), Path("runtime")]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.suffix not in {".gradle", ".gradle.kts"} or not path.is_file():
                      continue
                  content = path.read_text(encoding="utf-8")
                  updated = content.replace(
                      "tech.kayys.alkhawarizm:alkhawarizm-",
                      "tech.kayys.aljabr:aljabr-",
                  )
                  if updated != content:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(str(path))

          if not changed:
              raise SystemExit("No legacy Alkhawarizm dependency coordinates found; refusing silent no-op")
          print("Migrated legacy dependency coordinates in:")
          print("\\n".join(changed))
          PY

      # Correct the synthetic :tokenizer parent project until the upstream settings fix lands.
      - name: Fix AQLI tokenizer Gradle project directory
        working-directory: _aqli
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          content = settings.read_text(encoding="utf-8")
          old = 'if (rootPart in listOf("core", "spi", "sdk", "plugin", "observability", "tokenizer")) {'
          new = "\\n".join([
              "if (rootPart == \\"tokenizer\\") {",
              "            // The tokenizer module lives under framework/core.",
              "            mappedDir = \\"framework/core\\"",
              "        } else if (rootPart in listOf(\\"core\\", \\"spi\\", \\"sdk\\", \\"plugin\\", \\"observability\\")) {",
          ])
          if content.count(old) != 1:
              raise SystemExit("Unexpected AQLI settings.gradle.kts layout; refusing to patch")
          settings.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Cache Gradle packages (aqli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish AQLI SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          # Aljabr is included as a composite build at ../alkhawarizm.
          # Its current tech.kayys.aljabr coordinates are substituted from source.
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ─────────────────────────────────────────────────────────────────────

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
