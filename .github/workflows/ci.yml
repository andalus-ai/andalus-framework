name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # ── Alkhawarizm, Tafkir & Aqli SPI/SDK Bootstrap ───────────────────
      # aqli depends on alkhawarizm for low-level tensor & error-code modules.
      # alkhawarizm-safetensor-quantization depends on tech.kayys.tafkir:* SNAPSHOTs.
      # When tafkir is checked out as a sibling of alkhawarizm (../tafkir relative
      # to alkhawarizm), settings.gradle.kts uses it as a composite build and
      # Gradle substitutes Maven coordinates with source projects — no remote
      # SNAPSHOT resolution needed.
      - name: Checkout alkhawarizm (aqli dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/alkhawarizm
          path: alkhawarizm
          ref: main

      - name: Checkout tafkir (alkhawarizm composite build)
        uses: actions/checkout@v4
        with:
          repository: bhangun/tafkir
          path: tafkir
          ref: main

      - name: Checkout aqli (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aqli
          path: _aqli
          ref: main

      - name: Cache Gradle packages (aqli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish aqli SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          # Publish only the modules that andalus-framework depends on.
          # tafkir is checked out as a sibling of alkhawarizm so the composite
          # build in alkhawarizm/settings.gradle.kts finds it automatically.
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ─────────────────────────────────────────────────────────────────────

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
