name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # ── Alkhawarizm & Gollek SPI/SDK Bootstrap ──────────────────────────────
      # gollek depends on alkhawarizm for low-level tensor & error-code modules.
      # gollek-spi* and gollek-sdk* are SNAPSHOT artifacts not on Maven Central.
      - name: Checkout alkhawarizm (gollek dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/alkhawarizm
          path: alkhawarizm
          ref: main

      - name: Checkout gollek (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: bhangun/gollek
          path: _gollek
          ref: main

      - name: Cache Gradle packages (gollek)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gollek-gradle-${{ hashFiles('_gollek/gradle/wrapper/gradle-wrapper.properties', '_gollek/build.gradle.kts') }}
          restore-keys: |
            gollek-gradle-

      - name: Publish gollek SPI & SDK to Maven Local
        working-directory: _gollek
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          # Strip optional composite builds if they don't exist in runner
          sed -i '/includeBuild("\.\.\/tafkir")/d' settings.gradle.kts || true
          if [ ! -d "../alkhawarizm" ]; then
            sed -i '/includeBuild("\.\.\/alkhawarizm")/d' settings.gradle.kts || true
          fi
          # Publish only the modules that exist and that andalus depends on.
          TASKS=(
            :spi:gollek-spi:publishToMavenLocal
            :spi:gollek-spi-audio:publishToMavenLocal
            :spi:gollek-spi-image:publishToMavenLocal
            :spi:gollek-spi-inference:publishToMavenLocal
            :spi:gollek-spi-multimodal:publishToMavenLocal
            :spi:gollek-spi-plugin:publishToMavenLocal
            :spi:gollek-spi-runtime:publishToMavenLocal
            :sdk:gollek-sdk-core:publishToMavenLocal
            :sdk:gollek-sdk:publishToMavenLocal
            :sdk:gollek-sdk-local:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ────────────────────────────────────────────────────────────────────────

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
