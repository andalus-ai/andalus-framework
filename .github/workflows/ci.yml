name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # ── Aljabr & AQLI SPI/SDK Bootstrap ────────────────────────────
      # The canonical AQLI repository has completed the Alkhawarizm -> Aljabr
      # source/package migration. Check out both current repositories using the
      # sibling path expected by AQLI's composite-build settings.
      - name: Checkout aljabr (AQLI source dependency)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aljabr
          path: aljabr
          ref: main

      - name: Checkout aqli (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aqli
          path: _aqli
          ref: main

      - name: Cache Gradle packages (aqli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish AQLI SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          # Publish the exact AQLI coordinates consumed by Andalus modules.
          # Aljabr is included as a composite build from ./aljabr by AQLI settings.
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-api:publishToMavenLocal
            :sdk:aqli-sdk-protobuf:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
            :core:aqli-core:publishToMavenLocal
            :plugin:aqli-plugin-kernel-core:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ─────────────────────────────────────────────────────────────────────

      - name: Checkout gamelan (workflow engine dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/gamelan
          path: gamelan
          ref: main

      - name: Publish Gamelan SPI & Executor SDK to Maven Local
        working-directory: gamelan
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          # Andalus currently consumes these Gamelan artifacts at 1.0.0-SNAPSHOT.
          # Override the repository's Gradle default so the published coordinates
          # match the Maven dependencies exactly.
          ./gradlew \
            :gamelan-engine-spi:publishToMavenLocal \
            :gamelan-plugin-spi:publishToMavenLocal \
            :gamelan-sdk-executor-core:publishToMavenLocal \
            --no-daemon -x test --parallel \
            -Pgamelan.publish.enabled=true \
            -Pgamelan.version=1.0.0-SNAPSHOT

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
